# Build the Astro site and publish it to GitHub Pages.
#
# Pages is set to the "GitHub Actions" source rather than "deploy from a
# branch", because the repository holds Astro source and not the built HTML.
# A branch source would hand the raw src/ tree to Jekyll and serve nothing
# usable.
#
# public/CNAME travels into dist/ on every build, which is what keeps the
# custom domain bound after a deploy.
#
# `npm run check` gates the build. A type error therefore blocks a deploy, which
# is the deliberate trade: the alternative is a gate that exists and is ignored.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a cancelled deploy can
# leave the site serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The type gate, ahead of the build and blocking it.
  #
  # It is a separate job rather than a step inside build/ because
  # withastro/action bundles its own checkout, setup-node and install and gives
  # no hook to run anything before the build. A failure here also has to read as
  # "types", not as "the deploy broke".
  #
  # astro check regenerates .astro/types.d.ts itself, so this needs no committed
  # generated file and works on a fresh clone.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same 24.x the build job and local development use. A different
          # Node here would mean the gate and the build disagree about the
          # toolchain that produced the errors.
          node-version: 24
          cache: npm
      # `npm ci` and not `npm install`: the lockfile is the point of a gate.
      # It prints an unapproved-script notice for @parcel/watcher (an optional
      # native watcher pulled in by @astrojs/check) and that is expected --
      # the repo's allowScripts policy names esbuild only, and nothing here
      # needs the watcher.
      - run: npm ci
      - run: npm run check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # withastro/action bundles checkout/setup-node/upload-pages-artifact
      # internally, so its version is what decides whether this workflow trips
      # the runner's Node 20 deprecation warning. v3 did; v6 does not.
      - uses: withastro/action@v6
        with:
          # Pinned to match the Node the site is developed and built on
          # locally (24.x). astro requires >=22.12.0.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
