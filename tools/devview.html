<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>devview — HyperQuant Media local device harness</title>
<!--
  Local-only device/resolution harness for this site.

  It is served by a dev-only Vite middleware declared in astro.config.mjs, at
  http://<host>:4321/devview. Two consequences worth knowing:

    - It NEVER lands in dist/. The middleware is `apply: 'serve'`, so the
      production build has no idea this file exists. Nothing here ships.
    - It is SAME-ORIGIN with the site. That is the whole reason it can force a
      theme, read each frame's scrollWidth, count undersized tap targets, and
      catch script errors. Opening this file over file:// instead would make
      every frame cross-origin and reduce it to a wall of pictures.

  It is deliberately dependency-free: one file, no build step, works in
  whatever browser you point at it — which is also how you check a real
  engine. Chromium, Firefox and Safari each render THIS page's frames with
  their own engine, so the harness itself is the cross-engine test.

  For touch, gesture, and real-mobile-browser behaviour there is no substitute
  for the device: start the server with --host and open the LAN URL printed in
  the header bar on the phone itself.
-->
<style>
  :root {
    --bg: #0a0a14;
    --bg-2: #12121f;
    --bg-3: #1a1a2b;
    --line: #2a2a44;
    --ink: #e8eaf6;
    --ink-dim: #9aa0c0;
    --accent: #ffce6e;
    --ok: #57e1c4;
    --bad: #ff6b5e;
    --warn: #ffb454;
    --pad: 10px;
  }
  :root[data-theme="light"] {
    --bg: #eef1f8; --bg-2: #ffffff; --bg-3: #e3e7f3; --line: #c6cde0;
    --ink: #14172b; --ink-dim: #555d7a; --accent: #8a5a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ─────────────────────────────────────────────── */
  header {
    flex: none;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    padding: 8px var(--pad);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    position: relative;
    z-index: 5;
  }
  header .grp { display: flex; align-items: center; gap: 6px; }
  header .grp > label { color: var(--ink-dim); text-transform: uppercase; font-size: 10px; letter-spacing: .08em; }
  .brand { font-weight: 700; color: var(--accent); letter-spacing: .06em; margin-right: 4px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); }

  select, input[type="text"], button {
    font: inherit;
    background: var(--bg-3);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
  }
  input[type="text"] { min-width: 190px; }
  input[type="number"] { width: 68px; font: inherit; background: var(--bg-3); color: var(--ink);
                         border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .times { color: var(--ink-dim); }
  .hint { font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
  .hint b { color: var(--ink); font-weight: 600; }
  .hint.warn { color: var(--warn); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .chk { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-dim); cursor: pointer; }
  .chk input { accent-color: var(--accent); }

  .lan {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-dim);
    font-size: 11px;
  }
  .lan code {
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 6px;
    color: var(--ink);
    cursor: pointer;
  }
  .lan code:hover { border-color: var(--accent); }

  /* ── Device picker ───────────────────────────────────────── */
  #picker {
    flex: none;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    padding: 6px var(--pad);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: center;
    max-height: 30vh;
    overflow-y: auto;
  }
  #picker .setgrp { color: var(--ink-dim); text-transform: uppercase; font-size: 10px; letter-spacing: .08em; margin-left: 8px; }
  #picker .setgrp:first-child { margin-left: 0; }
  #picker label { white-space: nowrap; }

  /* ── Stage ───────────────────────────────────────────────── */
  #stage {
    flex: 1;
    overflow: auto;
    padding: var(--pad);
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 18px;
    background:
      repeating-linear-gradient(45deg, transparent 0 12px, color-mix(in srgb, var(--line) 26%, transparent) 12px 13px);
  }

  .frame { flex: none; }
  .frame .cap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 2px 4px;
    font-size: 11px;
    color: var(--ink-dim);
  }
  .frame .cap b { color: var(--ink); font-weight: 600; }
  .frame .cap .badge {
    border-radius: 4px;
    padding: 1px 5px;
    border: 1px solid var(--line);
    background: var(--bg-2);
  }
  .badge.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .badge.ok   { color: var(--ok); }
  .frame .cap .spacer { margin-left: auto; }
  .frame .cap a, .frame .cap button {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; text-decoration: none;
    color: var(--ink-dim); background: var(--bg-2); border: 1px solid var(--line);
  }
  .frame .cap a:hover, .frame .cap button:hover { color: var(--accent); border-color: var(--accent); }

  .shell {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .shell.notch::before {
    /* Stand-in for the phone status bar / safe-area inset, so a header that
       would tuck under it is visible as a problem here too. */
    content: "";
    position: absolute; top: 0; left: 0; right: 0;
    height: var(--inset, 0px);
    background: color-mix(in srgb, var(--bad) 22%, transparent);
    border-bottom: 1px dashed color-mix(in srgb, var(--bad) 60%, transparent);
    pointer-events: none;
    z-index: 2;
  }
  .shell iframe {
    display: block;
    border: 0;
    background: var(--bg);
    transform-origin: 0 0;
  }

  #empty {
    margin: auto;
    color: var(--ink-dim);
    text-align: center;
    max-width: 44ch;
    line-height: 1.7;
  }
  #empty kbd { background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

  /* ── Findings drawer ─────────────────────────────────────── */
  #drawer {
    flex: none;
    background: var(--bg-2);
    border-top: 1px solid var(--line);
    max-height: 34vh;
    overflow: auto;
    padding: 8px var(--pad);
    display: none;
  }
  #drawer.open { display: block; }
  #drawer h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim); margin: 0 0 6px; }
  #drawer ul { margin: 0; padding-left: 18px; }
  #drawer li { margin: 2px 0; }
  #drawer li .who { color: var(--accent); }
  #drawer .none { color: var(--ok); }
</style>
</head>
<body>

<header>
  <span class="brand">devview</span>

  <div class="grp">
    <label for="path">path</label>
    <select id="path"></select>
    <input type="text" id="pathCustom" placeholder="/or/type/a/path" />
  </div>

  <div class="sep"></div>

  <div class="grp">
    <label for="device">device</label>
    <select id="device" title="Show one device on its own. (wall) keeps whatever the checkbox row below has picked."></select>
  </div>

  <div class="grp">
    <label for="size">size</label>
    <select id="size" title="Viewport in CSS px. 'device' lets each frame use its own; anything else overrides every frame."></select>
    <input type="number" id="sizeW" min="200" max="5000" step="1" title="custom width in CSS px" />
    <span class="times">×</span>
    <input type="number" id="sizeH" min="200" max="5000" step="1" title="custom height in CSS px" />
  </div>

  <div class="grp">
    <label for="dpr">dpr</label>
    <select id="dpr" title="Device pixel ratio seen by scripts inside the frame. JS-visible only — see the dpr readout at the right."></select>
  </div>

  <div class="sep"></div>

  <div class="grp">
    <label for="theme">theme</label>
    <select id="theme">
      <option value="dark">dark</option>
      <option value="light">light</option>
      <option value="system">system</option>
    </select>
  </div>

  <div class="grp">
    <label for="zoom">zoom</label>
    <select id="zoom">
      <option value="fit">fit</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5" selected>50%</option>
      <option value="0.35">35%</option>
      <option value="0.25">25%</option>
    </select>
  </div>

  <div class="grp">
    <button id="rotate" title="Swap width and height on every frame">rotate</button>
    <button id="sync" title="Scroll one frame, scroll them all (proportionally)">sync&nbsp;scroll</button>
    <button id="insets" title="Overlay a 44px status-bar / safe-area band on phone frames">insets</button>
    <button id="reload" title="Reload every frame">reload</button>
    <button id="audit" title="Re-measure overflow, tap targets and script errors">audit</button>
  </div>

  <div class="lan">
    <span id="dprHint" class="hint"></span>
    <span class="sep"></span>
    <span>real device →</span>
    <span id="lanUrls"></span>
  </div>
</header>

<div id="picker"></div>

<div id="stage"><div id="empty">No frames selected.<br />Pick a device above, or hit <kbd>phones</kbd>.</div></div>

<div id="drawer">
  <h2 id="drawerTitle">findings</h2>
  <div id="drawerBody"></div>
</div>

<script type="module">
import { ALL, PATHS, PHONE_MAX, DPR_STEPS } from '/devview/devices.mjs';

(function () {
  'use strict';

  const el = (id) => document.getElementById(id);
  const stage = el('stage');
  const state = {
    path: '/',
    theme: 'dark',
    zoom: 0.5,
    rotate: false,
    sync: false,
    insets: false,
    picked: new Set(ALL.filter((d) => d.on).map((d) => d.n)),
    /* 'device' means every frame keeps its own value; a number overrides all
       of them. Kept as two separate overrides rather than one 'profile' so a
       real device's width can be paired with someone else's density — which
       is the combination that actually catches asset bugs. */
    size: 'device',   // 'device' | 'WxH'
    cw: 1280,
    ch: 800,
    dpr: 'device',    // 'device' | number
  };

  /* ── URL state, so a layout you are chasing survives a reload ── */
  function readUrl() {
    const q = new URLSearchParams(location.search);
    if (q.get('path')) state.path = q.get('path');
    if (q.get('theme')) state.theme = q.get('theme');
    if (q.get('zoom')) state.zoom = q.get('zoom') === 'fit' ? 'fit' : parseFloat(q.get('zoom'));
    state.rotate = q.get('rotate') === '1';
    state.insets = q.get('insets') === '1';
    if (q.get('d')) state.picked = new Set(q.get('d').split(','));
    if (q.get('size')) state.size = q.get('size');
    if (q.get('dpr')) state.dpr = q.get('dpr') === 'device' ? 'device' : parseFloat(q.get('dpr'));
    const m = /^(\d+)x(\d+)$/.exec(state.size || '');
    if (m) { state.cw = +m[1]; state.ch = +m[2]; }
  }
  function writeUrl() {
    const q = new URLSearchParams({
      path: state.path,
      theme: state.theme,
      zoom: String(state.zoom),
      rotate: state.rotate ? '1' : '0',
      insets: state.insets ? '1' : '0',
      d: [...state.picked].join(','),
      size: state.size,
      dpr: String(state.dpr),
    });
    history.replaceState(null, '', '?' + q.toString());
  }

  /* ── Toolbar ─────────────────────────────────────────────── */
  const pathSel = el('path');
  PATHS.forEach((p) => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    pathSel.append(o);
  });

  /* The device dropdown is a shortcut to the checkbox row below, not a second
     source of truth: picking one solos it, and '(wall)' means "leave the
     checkboxes alone". One selection model, two ways to drive it. */
  const deviceSel = el('device');
  {
    const wall = document.createElement('option');
    wall.value = ''; wall.textContent = '(wall)';
    deviceSel.append(wall);
    ['phone', 'tablet', 'desktop', 'edges'].forEach((g) => {
      const og = document.createElement('optgroup');
      og.label = g;
      ALL.filter((d) => d.g === g).forEach((d) => {
        const o = document.createElement('option');
        o.value = d.n;
        o.textContent = d.n + '  ' + d.w + '×' + d.h + '  @' + d.dpr + 'x';
        og.append(o);
      });
      deviceSel.append(og);
    });
  }

  const sizeSel = el('size');
  {
    const own = document.createElement('option');
    own.value = 'device'; own.textContent = 'device';
    sizeSel.append(own);
    /* Every distinct viewport the table already describes, so the size list
       and the device list can never drift apart. */
    const seen = new Set();
    ALL.forEach((d) => {
      const k = d.w + 'x' + d.h;
      if (seen.has(k)) return;
      seen.add(k);
      const o = document.createElement('option');
      o.value = k; o.textContent = d.w + '×' + d.h;
      sizeSel.append(o);
    });
    const custom = document.createElement('option');
    custom.value = 'custom'; custom.textContent = 'custom…';
    sizeSel.append(custom);
  }

  const dprSel = el('dpr');
  {
    const own = document.createElement('option');
    own.value = 'device'; own.textContent = 'device';
    dprSel.append(own);
    DPR_STEPS.forEach((v) => {
      const o = document.createElement('option');
      o.value = String(v); o.textContent = v + 'x';
      dprSel.append(o);
    });
  }

  function syncToolbar() {
    pathSel.value = PATHS.includes(state.path) ? state.path : '';
    el('pathCustom').value = PATHS.includes(state.path) ? '' : state.path;
    el('theme').value = state.theme;
    el('zoom').value = String(state.zoom);
    const solo = [...state.picked];
    deviceSel.value = solo.length === 1 && ALL.some((d) => d.n === solo[0]) ? solo[0] : '';
    sizeSel.value = state.size === 'device' ? 'device'
      : (Array.from(sizeSel.options).some((o) => o.value === state.size) ? state.size : 'custom');
    const custom = sizeSel.value === 'custom';
    el('sizeW').style.display = custom ? '' : 'none';
    el('sizeH').style.display = custom ? '' : 'none';
    el('sizeW').nextElementSibling.style.display = custom ? '' : 'none';
    el('sizeW').value = state.cw;
    el('sizeH').value = state.ch;
    dprSel.value = String(state.dpr);
    el('rotate').classList.toggle('on', state.rotate);
    el('sync').classList.toggle('on', state.sync);
    el('insets').classList.toggle('on', state.insets);
  }

  pathSel.addEventListener('change', () => { state.path = pathSel.value; el('pathCustom').value = ''; render(); });
  el('pathCustom').addEventListener('change', (e) => {
    const v = e.target.value.trim();
    if (v) { state.path = v.startsWith('/') ? v : '/' + v; render(); }
  });
  el('theme').addEventListener('change', (e) => { state.theme = e.target.value; render(); });

  deviceSel.addEventListener('change', () => {
    if (!deviceSel.value) return;              // '(wall)' leaves the picker alone
    state.picked = new Set([deviceSel.value]);
    buildPicker(); render();
  });
  sizeSel.addEventListener('change', () => {
    if (sizeSel.value === 'custom') { state.size = state.cw + 'x' + state.ch; }
    else { state.size = sizeSel.value; }
    render();
  });
  const onCustomSize = () => {
    state.cw = Math.max(200, Math.min(5000, parseInt(el('sizeW').value, 10) || state.cw));
    state.ch = Math.max(200, Math.min(5000, parseInt(el('sizeH').value, 10) || state.ch));
    state.size = state.cw + 'x' + state.ch;
    render();
  };
  el('sizeW').addEventListener('change', onCustomSize);
  el('sizeH').addEventListener('change', onCustomSize);
  dprSel.addEventListener('change', (e) => {
    state.dpr = e.target.value === 'device' ? 'device' : parseFloat(e.target.value);
    /* A frame reads devicePixelRatio while it boots, so the override has to be
       in place before the scripts run — which means a reload, not a repaint. */
    render();
  });
  el('zoom').addEventListener('change', (e) => {
    state.zoom = e.target.value === 'fit' ? 'fit' : parseFloat(e.target.value);
    layout();
    writeUrl();
  });
  el('rotate').addEventListener('click', () => { state.rotate = !state.rotate; render(); });
  el('insets').addEventListener('click', () => { state.insets = !state.insets; render(); });
  el('sync').addEventListener('click', () => { state.sync = !state.sync; syncToolbar(); });
  el('reload').addEventListener('click', () => render());
  el('audit').addEventListener('click', () => auditAll());

  /* ── Device picker ───────────────────────────────────────── */
  const picker = el('picker');
  function buildPicker() {
    picker.replaceChildren();
    const groups = ['phone', 'tablet', 'desktop', 'edges'];
    groups.forEach((g) => {
      const h = document.createElement('span');
      h.className = 'setgrp';
      h.textContent = g;
      picker.append(h);

      const quick = document.createElement('button');
      quick.textContent = 'all';
      quick.title = 'Select only this group';
      quick.addEventListener('click', () => {
        state.picked = new Set(ALL.filter((d) => d.g === g).map((d) => d.n));
        buildPicker(); render();
      });
      picker.append(quick);

      ALL.filter((d) => d.g === g).forEach((d) => {
        const lab = document.createElement('label');
        lab.className = 'chk';
        lab.title = d.note || (d.w + '×' + d.h);
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = state.picked.has(d.n);
        cb.addEventListener('change', () => {
          if (cb.checked) state.picked.add(d.n); else state.picked.delete(d.n);
          render();
        });
        lab.append(cb, document.createTextNode(d.n + ' ' + d.w));
        picker.append(lab);
      });
    });
  }

  /* ── LAN URLs, for the real-device half of the job ───────── */
  function lanHint() {
    const box = el('lanUrls');
    const here = location.origin;
    const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    const mk = (text, title) => {
      const c = document.createElement('code');
      c.textContent = text;
      c.title = title || 'click to copy';
      c.addEventListener('click', () => navigator.clipboard?.writeText(text));
      return c;
    };
    box.replaceChildren();
    if (isLocal) {
      const s = document.createElement('span');
      s.textContent = 'start with --host, then open this page at the LAN address';
      box.append(s);
    } else {
      box.append(mk(here + state.path, 'open this on the phone'));
    }
  }

  /* ── Frames ──────────────────────────────────────────────── */
  const frames = [];   // { dev, wrap, iframe, capEls }

  function render() {
    frames.length = 0;
    stage.replaceChildren();
    const picked = ALL.filter((d) => state.picked.has(d.n));

    if (!picked.length) {
      const e = document.createElement('div');
      e.id = 'empty';
      e.innerHTML = 'No frames selected.<br />Pick a device above, or hit an <kbd>all</kbd> button.';
      stage.append(e);
      syncToolbar(); writeUrl(); lanHint(); dprHint();
      return;
    }

    picked.forEach((d) => {
      /* The size override wins over the profile's own viewport, so a real
         device's density can be tried at a width it never ships at. Rotation
         applies after, to whichever pair is in force. */
      const om = /^(\d+)x(\d+)$/.exec(state.size);
      const bw = om ? +om[1] : d.w;
      const bh = om ? +om[2] : d.h;
      const w = state.rotate ? bh : bw;
      const h = state.rotate ? bw : bh;
      const dpr = state.dpr === 'device' ? (d.dpr || 1) : state.dpr;

      const wrap = document.createElement('div');
      wrap.className = 'frame';

      const cap = document.createElement('div');
      cap.className = 'cap';
      const name = document.createElement('b');
      name.textContent = d.n;
      const dims = document.createElement('span');
      dims.textContent = w + '×' + h + ' @' + dpr + 'x';
      dims.title = 'physical ' + Math.round(w * dpr) + '×' + Math.round(h * dpr) + ' px'
        + (om ? ' — width overridden, profile is ' + d.w + '×' + d.h : '')
        + (state.dpr !== 'device' && d.dpr && d.dpr !== dpr
           ? ' — dpr overridden, profile is ' + d.dpr + 'x' : '');
      const badges = document.createElement('span');
      badges.className = 'badges';
      const spacer = document.createElement('span');
      spacer.className = 'spacer';
      const open = document.createElement('a');
      open.href = state.path; open.target = '_blank'; open.textContent = 'open';
      open.title = 'Open this path in a real tab';
      cap.append(name, dims, badges, spacer, open);

      const shell = document.createElement('div');
      shell.className = 'shell' + (state.insets && d.inset ? ' notch' : '');
      if (state.insets && d.inset) shell.style.setProperty('--inset', d.inset + 'px');

      const iframe = document.createElement('iframe');
      iframe.width = w;
      iframe.height = h;
      iframe.src = state.path;
      iframe.title = d.n + ' ' + w + '×' + h;
      /* Astro's client-side router hijacks in-frame navigation; that is fine
         and worth exercising, but the frame must not be able to navigate the
         harness itself out from under us. */
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');

      shell.append(iframe);
      wrap.append(cap, shell);
      stage.append(wrap);

      const rec = { dev: d, w, h, dpr, override: !!om, wrap, shell, iframe, badges };
      frames.push(rec);

      iframe.addEventListener('load', () => { applyDpr(rec); applyTheme(rec); hookErrors(rec); auditFrame(rec); });
    });

    layout();
    syncToolbar();
    writeUrl();
    lanHint();
    dprHint();
  }

  /* Scale each frame down so many fit on screen. The iframe keeps its real
     pixel size (so the site still believes it is that wide) and only the
     presentation is scaled -- the whole point of a harness over a resize. */
  function layout() {
    const avail = stage.clientWidth - 24;
    frames.forEach((f) => {
      let z = state.zoom;
      if (z === 'fit') z = Math.min(1, avail / f.w);
      f.iframe.style.transform = 'scale(' + z + ')';
      f.shell.style.width = Math.round(f.w * z) + 'px';
      f.shell.style.height = Math.round(f.h * z) + 'px';
      f.wrap.style.width = Math.round(f.w * z) + 'px';
    });
  }
  window.addEventListener('resize', layout);
  el('zoom').addEventListener('change', layout);

  /* ── Device-pixel-ratio override ──────────────────────────────────────
     What this DOES reach: every script that reads window.devicePixelRatio.
     On this site that is the three canvases — scene.js sets the renderer's
     pixel ratio once at init, and comet.js / lost.js re-read it on resize,
     hence the synthetic resize below. Because scene.js is imported on
     requestIdleCallback (after first paint), an override installed on `load`
     lands before it boots.

     What it does NOT reach: srcset. The engine picks the 1x/2x/3x variant
     from the window's REAL ratio, before any of this runs, and there is no
     way to lie to it from script. So the dpr dropdown is honest about canvas
     behaviour and useless for asset selection — which is why the frames also
     report the variant each <img> actually loaded, and why the readout at the
     top right tells you the browser zoom that produces a given real ratio.
     For asset work at a fixed ratio, use that zoom, or the headless run. */
  function applyDpr(f) {
    let win;
    try { win = f.iframe.contentWindow; } catch (e) { return; }
    if (!win) return;
    try {
      if (win.__devviewDpr === f.dpr) return;
      win.__devviewDpr = f.dpr;
      Object.defineProperty(win, 'devicePixelRatio', {
        configurable: true,
        get: () => f.dpr,
      });
      win.dispatchEvent(new win.Event('resize'));
    } catch (e) { f.dprFailed = true; }
  }

  /* What real ratio the host browser is handing the frames, and the zoom that
     would make it match the selected one. devicePixelRatio moves with browser
     zoom, so this is a live reading, not a guess about the panel. */
  function dprHint() {
    const box = el('dprHint');
    const host = window.devicePixelRatio || 1;
    const want = state.dpr === 'device' ? null : state.dpr;
    box.classList.remove('warn');
    box.replaceChildren();
    const b = document.createElement('b');
    b.textContent = Math.round(host * 100) / 100 + 'x';
    box.append(document.createTextNode('srcset sees '), b);
    if (want && Math.abs(want - host) > 0.01) {
      box.classList.add('warn');
      box.append(document.createTextNode(' · zoom to '
        + Math.round((want / host) * 100) + '% for a real ' + want + 'x'));
    }
  }

  /* ── Theme forcing (needs same-origin, which is why we are served) ── */
  function applyTheme(f) {
    let doc;
    try { doc = f.iframe.contentDocument; } catch (e) { return; }
    if (!doc) return;
    try {
      const win = f.iframe.contentWindow;
      if (state.theme === 'system') {
        win.localStorage.removeItem('hqm-theme');
        doc.documentElement.removeAttribute('data-theme');
      } else {
        win.localStorage.setItem('hqm-theme', state.theme);
        doc.documentElement.setAttribute('data-theme', state.theme);
      }
    } catch (e) { /* storage blocked; the attribute above still bites */ }
  }

  /* ── Per-frame error capture ─────────────────────────────── */
  function hookErrors(f) {
    f.errors = f.errors || [];
    let win;
    try { win = f.iframe.contentWindow; } catch (e) { return; }
    if (!win || win.__devviewHooked) return;
    win.__devviewHooked = true;
    win.addEventListener('error', (e) => {
      f.errors.push((e.message || 'error') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || 0));
      paintBadges(f);
    });
    win.addEventListener('unhandledrejection', (e) => {
      f.errors.push('unhandled rejection: ' + String(e.reason).slice(0, 120));
      paintBadges(f);
    });
    const ce = win.console && win.console.error;
    if (ce) {
      win.console.error = function () {
        f.errors.push('console.error: ' + Array.from(arguments).join(' ').slice(0, 160));
        paintBadges(f);
        return ce.apply(this, arguments);
      };
    }
  }

  /* ── The measurements that actually matter ───────────────── */
  function auditFrame(f) {
    let doc, win;
    try { doc = f.iframe.contentDocument; win = f.iframe.contentWindow; } catch (e) { return; }
    if (!doc || !doc.body) return;

    const vw = win.innerWidth;
    const label = (n) => {
      const id = n.id ? '#' + n.id : '';
      const cls = typeof n.className === 'string' && n.className.trim()
        ? '.' + n.className.trim().split(/\s+/).slice(0, 2).join('.') : '';
      return n.tagName.toLowerCase() + id + cls;
    };

    // Horizontal overflow, and who is causing it.
    const wide = [];
    doc.querySelectorAll('body *').forEach((n) => {
      const r = n.getBoundingClientRect();
      if (r.height <= 0) return;
      if (r.right > vw + 1 || r.left < -1) wide.push(label(n) + ' [' + Math.round(r.left) + '..' + Math.round(r.right) + ']');
    });

    // Tap targets. WCAG 2.5.8 wants 24x24 CSS px; a phone-sized frame is
    // where this bites, so only flag it there.
    const small = [];
    if (f.w <= PHONE_MAX) {
      doc.querySelectorAll('a[href], button, input, select, textarea, [role="button"]').forEach((n) => {
        const r = n.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const p = n.parentElement;
        // Inline links inside running prose are exempt by the criterion.
        if (p && /^(P|LI|SPAN|EM|STRONG)$/.test(p.tagName) && p.textContent.trim() !== n.textContent.trim()) return;
        if (r.width < 24 || r.height < 24) {
          small.push(label(n) + ' "' + ((n.getAttribute('aria-label') || n.textContent || '').trim().slice(0, 20)) + '" '
            + Math.round(r.width) + '×' + Math.round(r.height));
        }
      });
    }

    // Does anything sit under the fixed header at rest?
    let underNav = 0;
    const nav = doc.getElementById('mainNav');
    if (nav) {
      const nb = nav.getBoundingClientRect();
      const main = doc.querySelector('main, .page-hero, .hero-section, section');
      if (main) {
        const mb = main.getBoundingClientRect();
        // Only a real text collision counts; a hero deliberately runs under.
        const firstText = main.querySelector('h1, h2, p');
        if (firstText) {
          const tb = firstText.getBoundingClientRect();
          if (tb.top < nb.bottom && tb.bottom > nb.top) underNav = Math.round(nb.bottom - tb.top);
        }
        void mb;
      }
    }

    // Header opacity: the thing we just changed, asserted rather than assumed.
    let navBg = '', navOpaque = null;
    if (nav) {
      navBg = win.getComputedStyle(nav).backgroundColor;
      const m = navBg.match(/rgba?\(([^)]+)\)/);
      const parts = m ? m[1].split(',').map((s) => parseFloat(s)) : [];
      navOpaque = parts.length < 4 || parts[3] >= 0.999;
    }

    /* Which density variant each <img> really loaded, and what the images
       cost on this viewport. currentSrc is the engine's own answer, so it is
       the one measurement here the dpr override cannot distort. Bytes come
       from Resource Timing -- same-origin, so transferSize is populated; 0
       means it came from cache, which is worth reading as 'cached' rather
       than as 'free'. */
    const imgs = [];
    let imgBytes = 0;
    const byUrl = new Map();
    try {
      win.performance.getEntriesByType('resource').forEach((r) => {
        if (r.initiatorType === 'img' || /\.(webp|avif|png|jpe?g|svg)(\?|$)/i.test(r.name)) {
          byUrl.set(r.name, r);
        }
      });
    } catch (e) { /* Resource Timing unavailable; the variant list still works */ }
    doc.querySelectorAll('img').forEach((im) => {
      const cur = im.currentSrc || im.src;
      if (!cur) return;
      let density = '';
      const set = im.getAttribute('srcset');
      if (set) {
        const hit = set.split(',').map((x) => x.trim())
          .find((x) => cur.endsWith(x.split(/\s+/)[0]));
        density = hit ? (hit.split(/\s+/)[1] || '') : '';
      }
      /* naturalWidth is corrected for the srcset x descriptor -- the 400px file
         behind `2x` reports 200 -- so the density has to be multiplied back
         before any ratio means anything. Measured against this site's own build:
         at deviceScaleFactor 2 the xbox logo loads the _1UAYHO variant, whose
         real decoded width is 400, and naturalWidth says 200. Without this the
         readout calls a retina host perfectly specified while it is pulling the
         same surplus a 1x host does. */
      const dm = /^([\d.]+)x$/.exec(density);
      const densityNum = dm ? parseFloat(dm[1]) : 1;
      const realW = Math.round(im.naturalWidth * densityNum);
      const realH = Math.round(im.naturalHeight * densityNum);

      const r = byUrl.get(cur);
      /* Dev serves every <Image> through /_image?href=<encoded>&w=&f=, so the
         raw URL is a wall of percent-escapes. Production is content-hashed
         filenames and needs no unwrapping — hence the fallback. */
      let label;
      try {
        const u = new URL(cur, location.href);
        const href = u.searchParams.get('href');
        if (href) {
          label = decodeURIComponent(href).split('?')[0].split('/').pop()
            + ' w' + (u.searchParams.get('w') || '?')
            + '.' + (u.searchParams.get('f') || '?');
        }
      } catch (e) { /* fall through to the basename */ }
      /* transferSize is 0 for a cache hit, which is not the same as free:
         encodedBodySize still carries what the device would have to pull on a
         cold load, and that is the number worth optimising against. */
      const bytes = r ? (r.transferSize || r.encodedBodySize || 0) : undefined;
      if (bytes) imgBytes += bytes;
      const box = im.getBoundingClientRect();
      imgs.push({
        name: label || cur.split('/').pop(),
        density: density || '(no srcset)',
        bytes,
        boxW: Math.round(box.width),
        box: Math.round(box.width) + '×' + Math.round(box.height),
        natW: im.naturalWidth,
        realW,
        /* The pixels really downloaded, not the density-corrected pair the DOM
           reports -- the readout is here to be believed. */
        natural: realW + '×' + realH,
      });
    });

    /* An image whose decoded pixels far exceed what its box needs is wasted
       bytes; the reverse is a blurry one. The 1.35 / 0.9 band leaves room for
       the fractional ratios without crying wolf on every frame.

       Judged against the ratio the ENGINE actually used -- the host window's
       real one -- not against the dpr dropdown. srcset selection cannot
       follow the override, so judging against a faked 3x would report every
       image on the page as under-specified and mean nothing. The gap between
       the two ratios is reported once per frame instead, below. */
    const realDpr = window.devicePixelRatio || 1;
    const overspec = imgs.filter((i) => i.boxW > 0 && i.realW > i.boxW * realDpr * 1.35);
    const underspec = imgs.filter((i) => i.boxW > 0 && i.realW < i.boxW * realDpr * 0.9);

    f.report = {
      imgs,
      imgBytes,
      realDpr,
      overspec,
      underspec,
      overflow: Math.max(0, doc.documentElement.scrollWidth - vw),
      wide: [...new Set(wide)].slice(0, 6),
      small: [...new Set(small)].slice(0, 8),
      underNav,
      navBg,
      navOpaque,
      docHeight: doc.documentElement.scrollHeight,
    };
    paintBadges(f);
  }

  function paintBadges(f) {
    const r = f.report;
    f.badges.replaceChildren();
    const add = (text, cls, title) => {
      const s = document.createElement('span');
      s.className = 'badge ' + (cls || '');
      s.textContent = text;
      if (title) s.title = title;
      f.badges.append(s);
    };
    if (!r) return;
    if (r.overflow > 0) add('overflow ' + r.overflow + 'px', 'bad', r.wide.join('\n'));
    if (r.small.length) add('tap ' + r.small.length, 'warn', r.small.join('\n'));
    if (r.underNav > 0) add('under nav ' + r.underNav + 'px', 'warn');
    if (r.navOpaque === false) add('nav translucent', 'warn', r.navBg);
    if (f.errors && f.errors.length) add('js ' + f.errors.length, 'bad', f.errors.join('\n'));
    if (r.imgs && r.imgs.length) {
      add('img ' + (r.imgBytes ? Math.round(r.imgBytes / 1024) + ' KB' : r.imgs.length + ' cached'),
        r.overspec.length ? 'warn' : '',
        r.imgs.map((i) => i.density + '  ' + i.name + '  box ' + i.box + '  natural ' + i.natural
          + (i.bytes ? '  ' + Math.round(i.bytes / 1024) + ' KB' : '  cached')).join('\n'));
    }
    if (f.dprFailed) add('dpr not applied', 'bad', 'devicePixelRatio could not be overridden in this frame');
    if (!r.overflow && !r.small.length && !r.underNav && r.navOpaque !== false
        && !(f.errors || []).length && !(r.overspec || []).length && !(r.underspec || []).length) {
      add('clean', 'ok');
    }
  }

  function auditAll() {
    frames.forEach(auditFrame);
    const drawer = el('drawer'), body = el('drawerBody');
    body.replaceChildren();
    const lines = [];
    frames.forEach((f) => {
      const r = f.report;
      if (!r) return;
      if (r.overflow) lines.push([f.dev.n, 'horizontal overflow ' + r.overflow + 'px — ' + (r.wide.join(' ; ') || 'source not identified')]);
      if (r.small.length) lines.push([f.dev.n, 'tap target under 24px — ' + r.small.join(' ; ')]);
      if (r.underNav) lines.push([f.dev.n, 'first heading sits ' + r.underNav + 'px under the fixed header']);
      if (r.navOpaque === false) lines.push([f.dev.n, 'header background is translucent (' + r.navBg + ')']);
      if (r.realDpr && Math.abs(f.dpr - r.realDpr) > 0.01) {
        lines.push([f.dev.n, 'dpr ' + f.dpr + 'x is script-visible only in this frame'
          + ' (canvases see it; srcset does not). The engine picked variants for the'
          + ' host ratio, ' + r.realDpr + 'x, and the image findings below are judged'
          + ' against that. For real ' + f.dpr + 'x assets, zoom the browser to '
          + Math.round((f.dpr / r.realDpr) * 100) + '% or use the headless run.']);
      }
      (r.overspec || []).forEach((i) => lines.push([f.dev.n,
        'image over-specified at ' + r.realDpr + 'x -- ' + i.name + ' decodes ' + i.natural
        + ' for a ' + i.box + ' box (' + i.density + ')']));
      (r.underspec || []).forEach((i) => lines.push([f.dev.n,
        'image under-specified at ' + r.realDpr + 'x -- ' + i.name + ' decodes ' + i.natural
        + ' for a ' + i.box + ' box (' + i.density + ')']));
      (f.errors || []).forEach((e) => lines.push([f.dev.n, 'script: ' + e]));
    });
    el('drawerTitle').textContent = 'findings — ' + state.path + ' · ' + state.theme
      + ' · dpr ' + state.dpr + ' · ' + frames.length + ' frame' + (frames.length === 1 ? '' : 's');
    if (!lines.length) {
      const d = document.createElement('div');
      d.className = 'none';
      d.textContent = 'Nothing flagged: no overflow, no undersized tap target, no header collision, no script error.';
      body.append(d);
    } else {
      const ul = document.createElement('ul');
      lines.forEach(([who, what]) => {
        const li = document.createElement('li');
        const w = document.createElement('span');
        w.className = 'who';
        w.textContent = who + ': ';
        li.append(w, document.createTextNode(what));
        ul.append(li);
      });
      body.append(ul);
    }
    drawer.classList.add('open');
  }

  /* ── Synchronised scrolling ──────────────────────────────── */
  let syncing = false;
  function wireSync() {
    setInterval(() => {
      if (!state.sync || syncing) return;
      // Poll rather than listen: frames are recreated often and a scroll
      // listener per frame would leak across reloads.
      let lead = null;
      frames.forEach((f) => {
        try {
          const y = f.iframe.contentWindow.scrollY;
          if (f._lastY === undefined) { f._lastY = y; return; }
          if (Math.abs(y - f._lastY) > 2 && lead === null) lead = f;
          f._lastY = y;
        } catch (e) { /* frame not ready */ }
      });
      if (!lead) return;
      syncing = true;
      let ratio = 0;
      try {
        const w = lead.iframe.contentWindow, d = lead.iframe.contentDocument;
        const max = d.documentElement.scrollHeight - w.innerHeight;
        ratio = max > 0 ? w.scrollY / max : 0;
      } catch (e) { syncing = false; return; }
      frames.forEach((f) => {
        if (f === lead) return;
        try {
          const w = f.iframe.contentWindow, d = f.iframe.contentDocument;
          const max = d.documentElement.scrollHeight - w.innerHeight;
          w.scrollTo(0, Math.round(ratio * Math.max(0, max)));
          f._lastY = w.scrollY;
        } catch (e) { /* not ready */ }
      });
      syncing = false;
    }, 120);
  }

  /* ── Keyboard ────────────────────────────────────────────── */
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === 'r') { state.rotate = !state.rotate; render(); }
    if (e.key === 's') { state.sync = !state.sync; syncToolbar(); }
    if (e.key === 'a') auditAll();
    if (e.key === 'i') { state.insets = !state.insets; render(); }
    if (e.key === 'p') {
      /* Cycle the density: device, then each step. The frames reload, because
         the override has to be in place before their scripts read it. */
      const seq = ['device'].concat(DPR_STEPS);
      const i = seq.findIndex((v) => String(v) === String(state.dpr));
      state.dpr = seq[(i + 1) % seq.length];
      render();
    }
    if (e.key === 'Escape') el('drawer').classList.remove('open');
  });

  readUrl();
  buildPicker();
  render();
  wireSync();
})();
</script>
</body>
</html>
